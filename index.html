<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NewRssFeed</title>
  <link rel="stylesheet" href="dist/output.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body class="font-sans bg-black text-[#dddddd] flex h-screen overflow-hidden">

  <!-- ── ANA İÇERİK (sidebar component tarafından doldurulur) ── -->
  <main class="main flex-1 flex flex-col min-w-0 overflow-hidden bg-black md:ml-60">

    <!-- topbar + filter bar → components/topbar.js tarafından enjekte edilir -->

    <!-- Anasayfa -->
    <section class="homepage-view flex-1 overflow-y-auto">
      <div class="homepage-inner max-w-xl mx-auto py-4 px-4">
        <ol class="homepage-cards flex flex-col gap-4 list-none" aria-label="Gönderi akışı"></ol>
        <div class="homepage-empty flex flex-col items-center py-16 text-center" hidden>
          <p class="empty-title text-[14px] text-[#666]">Henüz haber yok</p>
          <p class="empty-desc text-[13px] text-[#444] mt-1">Sol panelden RSS kaynağı ekleyerek başlayın.</p>
        </div>
        <div class="homepage-loading flex flex-col items-center gap-3 py-16" hidden>
          <span class="spinner inline-block w-5 h-5 border-2 border-[#1e1e1e] border-t-[#555] rounded-full animate-spin" role="status" aria-label="Yükleniyor"></span>
          <p class="text-[13px] text-[#444]">Haberler yükleniyor...</p>
        </div>
      </div>
    </section>

    <!-- Haberlik (feed view) -->
    <section class="articles-wrap flex-1 overflow-y-auto" hidden>
      <ol class="articles list-none" aria-live="polite" aria-label="Haber listesi"></ol>
      <section class="empty-state flex flex-col items-center py-16 text-center" hidden>
        <p class="empty-title text-[14px] text-[#666]">Henüz kaynak yok</p>
        <p class="empty-desc text-[13px] text-[#444] mt-1">Sol panelden bir RSS kaynağı ekleyerek başlayın.</p>
      </section>
      <section class="loading-state flex flex-col items-center gap-3 py-16" hidden>
        <span class="spinner inline-block w-5 h-5 border-2 border-[#1e1e1e] border-t-[#555] rounded-full animate-spin" role="status" aria-label="Yükleniyor"></span>
        <p class="text-[13px] text-[#444]">Yükleniyor...</p>
      </section>
    </section>

  </main>

  <!-- Toast -->
  <output class="toast fixed bottom-20 left-1/2 -translate-x-1/2 z-100 px-4 py-2 rounded-lg bg-[#1a1a1a] border border-[#2a2a2a] text-[#ddd] text-sm opacity-0 transition-opacity pointer-events-none" aria-live="polite"></output>

  <!-- ── SCRIPTS ── -->
  <script src="env.js"></script>
  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/state.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/feed.js"></script>
  <script src="js/render.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/events.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/tabs.js"></script>

  <!-- Component HTML şablonları (main.js'den önce yüklenmeli) -->
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/topbar.js"></script>
  <script src="js/components/reels.js"></script>
  <script src="js/components/mobile.js"></script>
  <script src="js/components/modals.js"></script>
  <!-- Component loader — tüm parçaları DOM'a monte eder -->
  <script src="js/components/index.js"></script>

  <script src="js/main.js"></script>
</body>
</html>
