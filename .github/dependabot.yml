version: 2
updates:
  # npm / Node.js
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      expo-packages:
        patterns:
          - "expo*"
          - "@expo/*"
      react-native:
        patterns:
          - "react-native*"
          - "@react-native*"
          - "@react-navigation*"
    ignore:
      # Major version bumps gözden geçirilsin
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    timezone: "Europe/Istanbul"
    labels:
      - dependencies
      - github-actions

  # Python (recommendation engine)
  - package-ecosystem: pip
    directory: /recommendation
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
    timezone: "Europe/Istanbul"
    labels:
      - dependencies
      - python
