name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'   # pre-release: v1.0.0-beta.1

# Global default: read-only
permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # required to create a release

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check (gate before release)
        run: npx tsc --noEmit

      - name: Extract version from tag
        id: version
        # Pass via env to avoid script injection
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          VERSION="${GIT_REF#refs/tags/}"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

      - name: Extract changelog section
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$VERSION" '
              /^## /{
                if (found) exit
                if ($0 ~ ver) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md > release_notes.txt
          else
            echo "Release $VERSION" > release_notes.txt
          fi

          # Fallback: empty changelog → generic message
          if [ ! -s release_notes.txt ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md) for details." > release_notes.txt
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          name: "NewRssFeed ${{ steps.version.outputs.VERSION }}"
          body_path: release_notes.txt
          draft: false
          prerelease: >-
            ${{
              contains(github.ref, '-alpha') ||
              contains(github.ref, '-beta')  ||
              contains(github.ref, '-rc')
            }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
