name: EAS Build

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      platform:
        description: Build platform
        required: true
        default: all
        type: choice
        options: [all, android, ios]
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options: [development, preview, production]

# Global default: read-only
permissions:
  contents: read

jobs:
  build:
    name: EAS Build (${{ inputs.platform || 'all' }} / ${{ inputs.profile || 'preview' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60   # EAS builds can be slow
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo / EAS CLI
        uses: expo/expo-github-action@b2d16e30fd08559db9d05e4f8e7a3ed8df18f6b2 # v8.0.0
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Pass platform/profile via env to avoid script injection
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          BUILD_PROFILE: ${{ inputs.profile || 'preview' }}
        run: |
          npx eas-cli build \
            --platform "$BUILD_PLATFORM" \
            --profile "$BUILD_PROFILE" \
            --non-interactive
