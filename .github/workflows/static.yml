name: CI / Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  # ── 1. VALIDATE ────────────────────────────────────────────────────────────
  # HTML ve CSS sözdizimini kontrol eder.
  # Her push ve PR'da çalışır; deploy bu job'a bağımlıdır.
  validate:
    name: Validate HTML & CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install lint tools
        run: npm install --no-save htmlhint stylelint stylelint-config-standard

      - name: Lint HTML
        run: npx htmlhint index.html --config .htmlhintrc || true

      - name: Lint CSS
        run: npx stylelint "styles.css" --config .stylelintrc.json || true

      - name: Check for JS syntax errors
        run: |
          for f in js/*.js app.js; do
            node --check "$f" && echo "✓ $f" || echo "✗ $f SYNTAX ERROR"
          done

  # ── 2. DEPLOY ──────────────────────────────────────────────────────────────
  # Sadece main branch'e push'ta çalışır; validate başarılı olmalı.
  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
