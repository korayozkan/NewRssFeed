name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Global default: read-only (principle of least privilege)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + TypeScript ──────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

  # ── Python Recommendation Engine ──────────────────────────────────────────
  python-checks:
    name: Python Recommendation Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python deps
        run: |
          if [ -f recommendation/requirements.txt ]; then
            pip install -r recommendation/requirements.txt
          fi

      - name: Run smoke test
        run: |
          if [ -f recommendation/example_runner.py ]; then
            python recommendation/example_runner.py
          else
            echo "No example_runner.py found, skipping."
          fi
